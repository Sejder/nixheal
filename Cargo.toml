[package]
name = "nixheal"
version = "0.1.2"
edition = "2024"
description = "Pin NixOS packages that fail to build to their last good nixpkgs, and unpin them once they build again"
license = "MIT"
repository = "https://github.com/Sejder/nixheal"
homepage = "https://github.com/Sejder/nixheal"
readme = "README.md"
keywords = ["nix", "nixos", "flake", "update"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
