[package]
name = "autopin"
version = "0.1.0"
edition = "2024"
description = "Pin NixOS packages that fail to build to their last good nixpkgs, and unpin them once they build again"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
